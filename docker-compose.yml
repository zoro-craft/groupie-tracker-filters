name: groupie-tracker

services:
  groupie-tracker:
    image: elmehdirezoug/groupie-tracker:1.0.0
    container_name: groupie-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"

    # Security hardening
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
